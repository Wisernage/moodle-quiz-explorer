name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share your idea. Maintainer time is limited; clear use cases help prioritize work.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or workflow are you trying to improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Timo to behave? Optional sketches or API shapes welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
