# Usage:
#   docker compose up --build
#   # Import mybackup.mbz (replaces all quiz data in SQLite): .\scripts\load-sample.ps1
#   # Wipe persisted DB volume + import fresh file: .\scripts\reset-and-import.ps1
#   # Or: docker compose run --rm -v "${PWD}/mybackup.mbz:/tmp/mybackup.mbz:ro" timo import /tmp/mybackup.mbz -dsn 'file:/data/timo.db?cache=shared&_fk=1'
#   # Tests: docker compose --profile test run --rm test

services:
  timo:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite DB; drop extra .mbz files under ./imports/
      - timo-data:/data
      - ./imports:/imports:ro
      # Dev sample fixture (minimal quiz)
      - ./testdata:/testdata:ro
    command:
      - serve
      - -addr
      - 0.0.0.0:8080
      - -dsn
      - file:/data/timo.db?cache=shared&_fk=1
    restart: unless-stopped

  # Run tests: docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    volumes:
      - .:/src
    profiles:
      - test

volumes:
  timo-data:
